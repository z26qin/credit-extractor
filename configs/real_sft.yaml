# Step 2 of the parked plan: SFT on the teacher's pre-labels of the 120 train agreements, then a
# check on the 5 M1 agreements (src/real_loop.py, notebooks/05_real_sft.ipynb).
seed: 42
base_model: Qwen/Qwen3-4B-Instruct-2507
hub_prefix: real_sft

data:
  collect_prefix: collect_full          # agreement text on the Hub
  prelabel_prefix: prelabel_full        # teacher records on the Hub
  manifest: reports/collect_full_manifest.csv
  split: reports/collect_full_split.json
  empty_share: 0.30                     # chunks with no quote, at most this share of examples

sft:                    # the M4 recipe, with these changes for 24,000-character chunks on a T4
  max_seq_length: 8192  # the parked plan's Path 1; longer examples are dropped and counted
  epochs: 1             # 2 in the recipe; one epoch of these examples is about 7 T4 hours
  learning_rate: 2.0e-4
  warmup_ratio: 0.06
  grad_accum: 8
  r: 16
  alpha: 32
  save_steps: 10        # a step takes minutes, so checkpoints come often
  answer_logits_only: true

short_test:
  steps: 3              # on the longest examples, so memory is tested at its worst
  max_train_hours: 6.5  # fewer steps if the projection is longer, so scoring fits the session

# Scoring on the 5 M1 agreements through the M3 runner, with the chunks the student trained on:
# 24,000 characters, 4,000 overlap, page numbers removed. Model A runs again on the same chunks.
chunk_chars: 24000
overlap: 4000
max_tokens: 4096
ladder: [1.05, 1.15, 1.25]
batch_size: 16
max_model_len_cap: 65536
vllm_kwargs:
  gpu_memory_utilization: 0.90
  enforce_eager: false
m1_prefix: m1_collect
manifest: reports/m1_manifest.csv
sync_every_minutes: 3
