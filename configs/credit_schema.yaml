# Milestone 2: credit clause types and the three baseline conditions (reports/m2_prompts.md).
# The output format stays Model B's: one JSON object, every clause type a key, each value a
# list of verbatim quotes, and an empty list when the clause is absent.
# Definitions stay one sentence each and contain no double quotes.
clauses:
  - name: Financial Maintenance Covenant
    definition: A covenant requiring the borrower to keep a financial ratio, such as maximum leverage or minimum interest coverage, at a stated level, including any condition that springs the test.
  - name: Incremental Facility
    definition: The borrower's right to add new term loans or increase commitments under this agreement, including the size limit and conditions.
  - name: MFN Protection
    definition: Most favored nation pricing, under which existing term loans get a higher margin if new incremental debt is priced above them by more than a stated amount, including any sunset or carve-out.
  - name: Restricted Payments General Basket
    definition: The general-purpose exception to the restricted payments covenant, allowing dividends or distributions up to a stated dollar amount or share of EBITDA or assets.
  - name: Available Amount / Builder Basket
    definition: The cumulative amount, also called Cumulative Credit, that builds from a starter amount, retained cash flow or net income, and equity proceeds, and can be used for restricted payments, investments or junior debt prepayments.
  - name: Debt Incurrence General Basket
    definition: The general-purpose exception to the indebtedness covenant, allowing additional debt up to a stated dollar amount or share of EBITDA or assets.
  - name: Liens General Basket
    definition: The general-purpose exception to the liens covenant, allowing additional liens up to a stated dollar amount or share of EBITDA or assets.
  - name: Applicable Margin
    definition: The interest margin added to the benchmark rate, also called Applicable Rate, including any pricing grid.
  - name: Maturity Date
    definition: The date the loans or commitments finally mature, including any springing maturity or extension terms.
  - name: Liability Management Protections
    definition: Lender protections against liability management transactions, namely J.Crew limits on moving material intellectual property to unrestricted subsidiaries, Chewy limits on releasing guarantors that stop being wholly owned, and Serta limits on subordinating the loans or liens without each affected lender's consent.

conditions:
  - id: a
    label: Model B, native CUAD prompt
    model: Ihteshamstar/qwen3-4b-cuad-extractor
    prompt: cuad_native
  - id: b
    label: Model B, credit schema prompt
    model: Ihteshamstar/qwen3-4b-cuad-extractor
    prompt: credit_schema
  - id: c
    label: Model A, credit schema prompt
    model: Qwen/Qwen3-4B-Instruct-2507
    prompt: credit_schema
